[project]
name = "horae-plugin-school-fr"
version = "0.4.2"
description = "The school-fr Horae plugin: read-only PRONOTE and ÉcoleDirecte sources behind a lockout-safe login and poll budget."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "horae-sdk>=0.9,<0.10",
    "pronotepy==2.15.7",
    "requests>=2.32,<3",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/horae_school_fr"]

[dependency-groups]
# The core (`horae`) is not in this group: it is not on PyPI, and `horae plugin add` refuses a
# uv.lock with a git source (horae-dev/horae#199). The tests that need it (tests/test_deid.py and
# one de-identification test each in test_pronote.py and test_ecoledirecte.py) are skipped
# without it (`pytest.importorskip`); CI adds it to the test run, pinned to a core commit:
# `uv run --with "horae @ git+https://github.com/horae-dev/horae@<sha>" pytest --cov`
# (.github/workflows/ci.yml), so they run, and count for coverage, in the same step.
dev = [
    "mypy>=2.4",
    "pre-commit>=4.7",
    "pytest>=9.1",
    "pytest-cov>=7",
    "ruff>=0.17",
    "types-pyyaml>=6",
]

[tool.uv]
required-version = ">=0.13"
# No exclude-newer here: `horae plugin add` runs `uv sync --locked --no-config`, which ignores
# this table, so a lock resolved with it would not match. The 7-day cooldown on new releases
# is Renovate's minimumReleaseAge (renovate.json).

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PT"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105"]

[tool.mypy]
strict = true
files = ["src", "tests"]
python_version = "3.12"
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

# The core is not installed by `uv sync` (see [dependency-groups]): its modules are untyped here.
[[tool.mypy.overrides]]
module = ["horae", "horae.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
source = ["horae_school_fr"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "if __name__ == .__main__.:"]
