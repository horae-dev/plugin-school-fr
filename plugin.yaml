# Written by `uv run python -m horae_school_fr --manifest > plugin.yaml`; tests/test_manifest.py
# checks it is what the SDK writes. When installing, pin runtime.command to an absolute
# interpreter that has this package (horae-sdk README, "The command").
name: school-fr
version: 0.3.0
horae: '>=0,<0.2'
description: Read-only PRONOTE source behind a lockout-safe poll and login budget.
license: Apache-2.0
homepage: https://github.com/horae-dev/plugin-school-fr
provides:
  sources:
  - school-fr.status
  - school-fr.pronote
permissions:
  optional_secrets:
  - PRONOTE_CREDENTIALS
  intents:
  - task.create
runtime:
  protocol: mcp-stdio
  command:
  - python3
  - -m
  - horae_school_fr
